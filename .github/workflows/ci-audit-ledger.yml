name: Test private audit ledger module
on:
  push:
    branches:
      - feature/audit-ledger-v1
  pull_request:
    paths:
      - scripts/audit-ledger*
      - .github/workflows/ci-audit-ledger.yml
permissions:
  contents: read
jobs:
  audit-module-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run metadata privacy audit tests (no secrets)
        run: node --test scripts/audit-ledger.test.mjs
      - name: Static syntax checks
        run: node --check scripts/audit-ledger.mjs
