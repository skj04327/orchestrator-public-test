name: Private task from Termux to reviewed draft PR
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Opaque private task ID (never enter task text)"
        required: true
        type: string
      routing_mode:
        description: "Routing mode: auto, stable, or manual"
        required: false
        type: choice
        options: [auto, stable, manual]
        default: auto
      controller:
        description: "Control tower provider (only used in manual mode)"
        required: false
        type: choice
        options: [auto, claude, gemini, codex]
        default: auto
permissions:
  contents: read
concurrency:
  group: termux-task-intake
  cancel-in-progress: false
jobs:
  prepare-handoff:
    # HARD BLOCK: containment fixtures pass, but approved subscriber runtime,
    # provider/CI data policy, network limits and trusted validation are unfinished.
    # Repository variables cannot bypass this; remove only after reviewed verification.
    if: >-
      false &&
      github.actor == 'skj04327' && github.event_name == 'workflow_dispatch' &&
      vars.ORCHESTRATOR_LIVE_POLICY_CONFIRMED == 'true' &&
      vars.ORCHESTRATOR_FREE_STORAGE_CONFIRMED == 'true' &&
      inputs.task_id != '20261115T121256Z-10360-7098'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      public_key: ${{ steps.key.outputs.public_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Derive run-specific recipient public key (no private source)
        id: key
        env:
          TASK_ID: ${{ inputs.task_id }}
          PRIVATE_GAME_WRITE_TOKEN: ${{ secrets.PRIVATE_GAME_WRITE_TOKEN }}
        run: node scripts/prepare-private-handoff.mjs
  task-execution:
    needs: prepare-handoff
    if: github.actor == 'skj04327' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      handoff_ready: ${{ steps.execute.outputs.handoff_ready == 'true' && steps.upload.outcome == 'success' }}
    steps:
      - name: Validate task ID
        shell: bash
        env:
          TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+$ ]] || { echo "::error::Invalid task ID"; exit 1; }
          echo "STATUS: TASK_ID_VALID"
      - name: Checkout public orchestrator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout private task queue
        uses: actions/checkout@v4
        with:
          repository: skj04327/the-twilight-of-korea
          ref: orchestrator/task-queue
          path: task-private
          token: ${{ secrets.PRIVATE_GAME_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout private game main
        uses: actions/checkout@v4
        with:
          repository: skj04327/the-twilight-of-korea
          ref: main
          path: private-game
          token: ${{ secrets.PRIVATE_GAME_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated worker, stop processes, then seal on trusted host
        id: execute
        env:
          TASK_ID: ${{ inputs.task_id }}
          ORCHESTRATOR_ROUTING_MODE: ${{ inputs.routing_mode }}
          ORCHESTRATOR_CONTROLLER: ${{ inputs.controller }}
          # Must be an already loaded, immutable, policy-approved runtime image.
          # docker/worker is only the no-auth containment fixture foundation.
          ORCHESTRATOR_WORKER_IMAGE_ID: ${{ vars.ORCHESTRATOR_WORKER_IMAGE_ID }}
          HANDOFF_PUBLIC_KEY: ${{ needs.prepare-handoff.outputs.public_key }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          ANTIGRAVITY_OAUTH_B64: ${{ secrets.ANTIGRAVITY_OAUTH_B64 }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node scripts/run-protected-task.mjs
      - name: Transfer ONLY encrypted handoff
        id: upload
        if: always() && steps.execute.outputs.handoff_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: private-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/protected-handoff/bundle.enc
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Remove private checkouts and auth
        if: always()
        shell: bash
        run: |
          rm -rf task-private private-game "$RUNNER_TEMP/protected-handoff"
  task-publish:
    needs: [prepare-handoff, task-execution]
    if: >-
      always() && needs.prepare-handoff.result == 'success' &&
      needs.task-execution.outputs.handoff_ready == 'true' &&
      needs.task-execution.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fresh trusted publisher checkout (no game checkout)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download this run's ciphertext only
        uses: actions/download-artifact@v4
        with:
          name: private-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          # Untrusted artifact entries must never share the trusted script directory.
          path: ${{ runner.temp }}/incoming-handoff
      - name: Decrypt, recheck and publish private Draft PR
        id: publish
        env:
          TASK_ID: ${{ inputs.task_id }}
          EXECUTION_OUTCOME: ${{ needs.task-execution.result }}
          ORCHESTRATOR_HANDOFF_FILE: ${{ runner.temp }}/incoming-handoff/bundle.enc
          PRIVATE_GAME_WRITE_TOKEN: ${{ secrets.PRIVATE_GAME_WRITE_TOKEN }}
          ORCHESTRATOR_AUDIT_DIR: ${{ runner.temp }}/private-audit
        run: node scripts/publish-private-task.mjs
      - name: Save normalized metadata to private queue (also on failure)
        if: always()
        env:
          TASK_ID: ${{ inputs.task_id }}
          PRIVATE_GAME_WRITE_TOKEN: ${{ secrets.PRIVATE_GAME_WRITE_TOKEN }}
          ORCHESTRATOR_AUDIT_DIR: ${{ runner.temp }}/private-audit
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: node scripts/persist-private-audit.mjs
      - name: Delete decrypted metadata and ciphertext
        if: always()
        run: rm -rf .private-task-pr.json "${{ runner.temp }}/incoming-handoff" "${{ runner.temp }}/private-audit"
