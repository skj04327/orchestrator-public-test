name: Claude OAuth smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claude-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check credential presence
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::error::Claude token secret is missing"
            exit 1
          fi
          echo "Claude secret present"
      - name: Read-only Claude invocation
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read README.md and summarize it in one sentence. Do not modify files."
          claude_args: "--max-turns 3 --allowedTools Read,Glob,Grep"
