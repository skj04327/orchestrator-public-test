name: Claude subscription CLI authentication test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claude-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install official Claude CLI
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test Claude subscription and classify API failure safely
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ""
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Missing Claude subscription token"
            exit 1
          fi
          set +e
          claude -p "Reply with exactly OK." --output-format stream-json --verbose --max-turns 1 --debug-file "$RUNNER_TEMP/claude-debug.txt" > "$RUNNER_TEMP/claude-events.jsonl" 2> "$RUNNER_TEMP/claude-stderr.txt"
          rc=$?
          set -e
          CLAUDE_RC="$rc" python3 - <<'PY'
          import json, os, pathlib, re, sys
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          raw = (tmp/"claude-events.jsonl").read_text(errors="replace")[:300000]
          err = (tmp/"claude-stderr.txt").read_text(errors="replace")[:100000]
          debug = (tmp/"claude-debug.txt").read_text(errors="replace")[:600000] if (tmp/"claude-debug.txt").exists() else ""
          events = []
          for line in raw.splitlines()[:1000]:
              try:
                  obj = json.loads(line)
                  if isinstance(obj, dict):
                      events.append(obj)
              except (ValueError, TypeError):
                  pass
          results = [e for e in events if e.get("type") == "result"]
          result = results[-1] if results else {}
          success = (int(os.environ["CLAUDE_RC"]) == 0 and result.get("is_error") is False)
          if success:
              print("DIAG: CLAUDE_SUBSCRIPTION_AUTH_SUCCESS")
              sys.exit(0)
          print("DIAG: CLI_EXIT_CODE=" + str(os.environ["CLAUDE_RC"]))
          print("DIAG: TERMINAL_REASON=" + str(result.get("terminal_reason") or "missing")[:32])
          print("DIAG: RESULT_RECEIVED=" + str(bool(result)))
          # Analyze captured stream privately. Only fixed, predefined codes are printed.
          status_values = []
          for e in events:
              objects = [e, e.get("message")]
              for obj in objects:
                  if not isinstance(obj, dict):
                      continue
                  for name in ("api_error_status", "error_status", "status"):
                      v = obj.get(name)
                      if str(v) in ("400", "401", "403", "404", "429", "500", "502", "503"):
                          status_values.append(str(v))
          combined = raw + "\n" + err + "\n" + debug
          print("DIAG: DEBUG_FILE_PRESENT=" + str(bool(debug)))
          for code in ("400", "401", "403", "404", "429", "500", "502", "503"):
              if re.search(r"(?:API Error:|HTTP(?: status)?|status(?: code)?[:= ]+)\s*" + code + r"(?!\d)", combined, re.I):
                  status_values.append(code)
          status_values = list(dict.fromkeys(status_values))
          if status_values:
              print("DIAG: API_HTTP_STATUS=" + ",".join(status_values))
          labels = [
              ("OAUTH_TOKEN_INVALID", r"oauth access token is invalid|invalid oauth token|authentication_failed|invalid bearer token"),
              ("OAUTH_TOKEN_EXPIRED", r"oauth access token has expired|token expired|token has expired"),
              ("OAUTH_TOKEN_REVOKED", r"token.{0,20}revoked"),
              ("LOGIN_REQUIRED", r"not logged in|please log in|login required"),
              ("SUBSCRIPTION_OR_RATE_LIMIT", r"rate limit|usage limit|limit reached|limit exceeded|usage exhausted"),
              ("MODEL_UNAVAILABLE", r"model.{0,30}(not found|does not exist|not available|access denied)"),
              ("SERVICE_UNAVAILABLE", r"overloaded|service unavailable|connection refused|network error"),
          ]
          matches = [label for label, pat in labels if re.search(pat, combined, re.I)]
          for match in matches:
              print("DIAG: " + match)
          if not status_values and not matches:
              print("DIAG: UNCLASSIFIED_API_FAILURE")
          print("DIAG: Raw Claude response and credentials suppressed in public logs")
          sys.exit(1)
          PY
