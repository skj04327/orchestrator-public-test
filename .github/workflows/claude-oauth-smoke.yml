name: Claude subscription CLI authentication test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  claude-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install official Claude CLI
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test Claude subscription without revealing output
        shell: bash
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ""
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Missing Claude subscription token"
            exit 1
          fi
          set +e
          claude -p "Reply with exactly OK." --output-format json --max-turns 1 > "$RUNNER_TEMP/claude-result.json" 2> "$RUNNER_TEMP/claude-stderr.txt"
          rc=$?
          set -e
          CLAUDE_RC="$rc" python3 - <<'PY'
          import json, os, pathlib, re, sys
          p = pathlib.Path(os.environ["RUNNER_TEMP"])
          out = (p/"claude-result.json").read_text(errors="replace")[:200000]
          err = (p/"claude-stderr.txt").read_text(errors="replace")[:200000]
          status = int(os.environ["CLAUDE_RC"])
          try:
              result = json.loads(out)
          except Exception:
              result = {}
          success = status == 0 and result.get("is_error") is False and result.get("type") == "result"
          if success:
              print("DIAG: CLAUDE_SUBSCRIPTION_AUTH_SUCCESS")
              sys.exit(0)
          # Report only numeric HTTP error codes and tightly scoped error categories.
          # Do not print CLI output, stack traces, tokens, or full model response.
          combined = out + "\n" + err
          reported = False
          for code in ("401", "403", "429"):
              if re.search(r"(?<!\\d)" + code + r"(?!\\d)", combined):
                  print("DIAG: HTTP_" + code)
                  reported = True
          if re.search(r"OAuth access token (?:is invalid|has been revoked|expired)", combined, re.I):
              print("DIAG: OAUTH_TOKEN_REJECTED")
              reported = True
          if re.search(r"rate limit|usage limit|five.hour limit", combined, re.I):
              print("DIAG: RATE_OR_USAGE_LIMIT")
              reported = True
          if not reported:
              print("DIAG: UNCLASSIFIED_CLAUDE_ERROR")
          print("DIAG: CLI exited with non-success; raw output intentionally suppressed")
          sys.exit(1)
          PY
