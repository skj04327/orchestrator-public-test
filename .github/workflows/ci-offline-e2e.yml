name: Offline orchestrator end-to-end contract (NO secrets)
on:
  push:
    branches: [feature/offline-e2e-harness-v1]
  pull_request:
    paths:
      - scripts/orchestrator-offline-e2e.test.mjs
      - scripts/test-fixtures/**
      - scripts/execute-private-task.mjs
      - scripts/publish-private-task.mjs
      - scripts/persist-private-audit.mjs
      - scripts/private-handoff*
      - scripts/private-task-bundle*
      - scripts/seal-private-task.mjs
      - scripts/prepare-private-handoff.mjs
      - scripts/publish-workflow.test.mjs
      - scripts/protected-worker*
      - scripts/container-tar*
      - scripts/worker-entry.mjs
      - scripts/run-protected-task.mjs
      - scripts/subscription-policy*
      - scripts/check-subscription-policy.mjs
      - scripts/cli-runtime-probe*
      - scripts/private-queue*
      - scripts/local-job*
      - scripts/local-worker-bridge*
      - scripts/independent-check*
      - scripts/local-independent-checks*
      - scripts/isolated-check*
      - scripts/docker-command.mjs
      - scripts/pinned-private-baseline*
      - scripts/pinned-baseline-cli*
      - scripts/disk-baseline*
      - scripts/gh-blob-stream*
      - scripts/main-inventory.mjs
      - scripts/private-read-session.mjs
      - scripts/gh-private-environment.mjs
      - termux/ai
      - docker/worker/**
      - .github/workflows/task-intake.yml
      - .github/workflows/ci-offline-e2e.yml
permissions:
  contents: read
jobs:
  public-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test scripts parse
        run: |
          node --check scripts/orchestrator-offline-e2e.test.mjs
          node --check scripts/test-fixtures/mock-cli.mjs
          node --check scripts/test-fixtures/mock-fetch.mjs
      - name: Test actual orchestration and publisher against temporary synthetic fixtures
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          CLAUDE_CODE_OAUTH_TOKEN: ""
        run: node --test scripts/*.test.mjs
      - name: Build pinned public containment foundation (no auth or game data)
        run: docker build --tag orchestrator-containment-fixture:ci docker/worker
      - name: Real container attack regression (network disabled, synthetic inputs only)
        shell: bash
        run: |
          set -euo pipefail
          ORCHESTRATOR_TEST_IMAGE="$(docker image inspect orchestrator-containment-fixture:ci --format '{{.Id}}')" node --test scripts/protected-worker.docker-test.mjs
          ORCHESTRATOR_TEST_IMAGE="$(docker image inspect orchestrator-containment-fixture:ci --format '{{.Id}}')" node --test scripts/local-worker-bridge.docker-test.mjs
          ORCHESTRATOR_TEST_IMAGE="$(docker image inspect orchestrator-containment-fixture:ci --format '{{.Id}}')" node --test scripts/independent-checks.docker-test.mjs
